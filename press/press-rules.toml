# This repo is a press target (design 0006): every tracked excluded file
# declares its neutralization, and the identity variants that leaked in
# dogfood Run 3 (G3/G4/G5) are closed by declaration, not by ignores.

[rules]
# G3: the app short name appears glued (owned-attribute prefix in tests,
# a "-web" suffix in Dockerfile/Justfile) and in glued UPPERCASE forms —
# the token is word-disjoint in this repo. Comments here stay free of
# literal identity tokens: press control files are not rewritten, so a
# literal would ship stale into every pressed fork (run 4 PROBLEM-21).
substring_rewrite_fields = ["app_name", "app_name_upper"]
extra_exclude_files = [
  "tests/cli/__snapshots__/test_help_snapshots.ambr",
  "README.md",
  "docs/POST_INIT.md",
  "PROJECTS.md",
  ".release-please-manifest.json",
  ".claude/skills/new-python-project/README.md",
  "docs/source/index.md",
  "docs/source/about/philosophy.md",
  "docs/source/tutorials/full_project_setup.md",
]

[[clean]]
paths = ["src/{package_name}", "tests"]

[[edit]]
file = "pyproject.toml"
command = ["uv", "version", "0.1.0", "--frozen"]
expect = 'version = "0.1.0"'

# A fresh repository has its own history; do not inherit a release cutoff.
[[edit]]
file = "release-please-config.json"
command = [
  "uv",
  "run",
  "--no-project",
  "--python",
  "3.13",
  "python",
  "scripts/reset_release_history.py",
]
expect = '"packages": {'

# G2: bun.lock is excluded from rewrite; regenerate under the new identity.
[[regenerate]]
file = "uv.lock"
command = ["uv", "lock"]

[[regenerate]]
file = "bun.lock"
command = ["scripts/regen-bun-lock.sh"]
platforms = ["darwin", "linux"]
# Integrity hashes false-positive short substring-mode app names
# (run 4 PROBLEM-22) — boundary-safe content scan for hash-dense output.
scan = "boundary"

[[regenerate]]
file = "bun.lock"
command = ["powershell", "-NoProfile", "-File", "scripts/regen-bun-lock.ps1"]
platforms = ["win32"]
scan = "boundary"

# G1: CHANGELOG is release history of the template, not the fork.
[[reset]]
file = "CHANGELOG.md"
stub = "# Changelog\n"

# Help snapshots are length-sensitive generated text (run 4 PROBLEM-24):
# a pressed identity of a different length moves the 80-column wrap
# points, so the file regenerates under the new identity instead of being
# text-rewritten. Verify cannot run the command in its sandbox — the
# exemption is declared loudly per template-press issue #81.
[[regenerate]]
file = "tests/cli/__snapshots__/test_help_snapshots.ambr"
command = [
  "uv",
  "run",
  "pytest",
  "tests/cli/test_help_snapshots.py",
  "--snapshot-update",
  "--override-ini=addopts=",
]
verify_exempt = true
reason = "CLI help snapshots re-wrap at the new name's length; regenerated by the declared command and certified by the real press's post-command scan"

# Fork-facing removals (template-press issue #80): blueprint-only history
# and maintenance surfaces a pressed fork must not inherit (run 4
# PROBLEM-26). The blueprint keeps these files; the press deletes them in
# the fork.

[[remove]]
file = "docs/design/0005-template-press-tui-design.md"
reason = "template-press engine TUI design is engine history"

[[remove]]
file = ".github/workflows/update-contributors.yml"
reason = "app-secret-gated maintenance workflow; forks cannot run it"

[[remove]]
file = "tests/meta/test_contributors_workflow.py"
reason = "pins the removed update-contributors workflow; a removal takes its meta-tests with it (run 5 PROBLEM-29)"

[[remove]]
file = ".github/workflows/template-receipt-guard.yml"
reason = "template-only receipt guard; a fork legitimately commits its receipt"

[[remove]]
file = ".github/workflows/difftree-pr-comment.yml"
reason = "uses the template owner's difftree action; the rewritten uses: path would not exist for a fork owner"

[[remove]]
file = ".contributors.yml"
reason = "the template's contributor automation state"

[[remove]]
file = ".contributors.jsonl"
reason = "the template's contributor records"

[[remove]]
file = "CONTRIBUTORS.md"
reason = "the template's contributor roster; a fork starts its own"

[[remove]]
file = "tests/meta/test_contributors_state.py"
reason = "pins the removed contributor state files"

[[remove]]
file = "tests/meta/test_contributors_render.py"
reason = "pins the removed contributor roster rendering"

[[remove]]
dir = "research"
reason = "template-only development history; generated projects start their own"

[[remove]]
dir = "docs/research"
reason = "template-only development history; generated projects start their own"

[[remove]]
dir = "docs/superpowers"
reason = "template-only development history; generated projects start their own"

[[remove]]
dir = "prototypes/press_tui"
reason = "template-only development history; generated projects start their own"

[[remove]]
dir = "projects"
reason = "template project history; setup restores an empty project directory"

[[remove]]
file = ".claude/skills/new-python-project/SKILL.md"
reason = "template bootstrap skill and its dedicated contract test"

[[remove]]
file = "tests/meta/test_bootstrap_skill.py"
reason = "template bootstrap skill and its dedicated contract test"

[[remove]]
dir = "tests/bootstrap"
reason = "template acceptance tests generate a new project and must not recurse"

[[reset]]
file = "README.md"
stub_file = "press/stubs/readme.md"

[[reset]]
file = "docs/POST_INIT.md"
stub_file = "press/stubs/post-init.md"

[[reset]]
file = ".claude/skills/new-python-project/README.md"
stub_file = "press/stubs/retired-bootstrap.md"

[[reset]]
file = "PROJECTS.md"
stub_file = "press/stubs/projects.md"

[[reset]]
file = ".release-please-manifest.json"
stub = "{ \".\": \"0.1.0\" }\n"

[[reset]]
file = "docs/source/index.md"
stub_file = "press/stubs/docs-index.md"

[[reset]]
file = "docs/source/about/philosophy.md"
stub_file = "press/stubs/project-philosophy.md"

[[reset]]
file = "docs/source/tutorials/full_project_setup.md"
stub_file = "press/stubs/application-setup.md"
