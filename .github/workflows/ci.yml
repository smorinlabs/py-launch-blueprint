# CI/CD - per-job split (ITM-024 hardening + ITM-025 lint + ITM-026 ty +
# ITM-030 matrix). Hygiene tools live in their own workflows (ITM-011/014/017).
#
# WL-001/WL-002: tool versions come from uv.lock (`uv sync --locked` +
# `uv run --no-sync`), never floating `uvx` — CI matches local hooks exactly.
# WL-006/WL-019: `changes` gates the heavy jobs on docs-only PRs; `ci-ok` is
# the single required status for branch protection (skipped jobs count as ok).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue emits merge_group (not pull_request) for its speculative
  # merge — without this trigger the ci-ok required check never reports and
  # every queue entry deadlocks at "Expected".
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WL-019 - detect whether the diff touches anything beyond docs/prose, so
  # the expensive jobs (test matrix, typecheck, build) skip on docs-only PRs.
  # Shell-based (same pattern as large-file-guard) - no third-party action.
  # On push to main everything always runs. P12 adds two outputs:
  # - release: a release-please PR whose diff is only the version bump and
  #   changelog. Those commits already passed CI on main, so only build-smoke
  #   (the version is a packaging input) re-runs; the merge queue still runs
  #   everything on merge_group.
  # - release_tooling: the release generator or its inputs changed, so
  #   release-generation runs. Every other PR skips it.
  # Skipped jobs count as success for ci-ok, the required check.
  changes:
    name: changes
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      release: ${{ steps.detect.outputs.release }}
      release_tooling: ${{ steps.detect.outputs.release_tooling }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # need the PR base to diff against
      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Branch names are untrusted input: pass them via env, never inline.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          emit() {
            {
              echo "code=$1"
              echo "release=$2"
              echo "release_tooling=$3"
            } >> "$GITHUB_OUTPUT"
          }
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            emit true false true
            echo "INFO: ${EVENT_NAME} event - running all jobs"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
          # No `grep -q` below: it exits on the first match, the writer gets
          # SIGPIPE, and under pipefail a found match reads as "no match".
          # `grep ... >/dev/null` consumes the whole stream.

          # Release-please fast path: same-repo release-please branch AND a
          # diff that is only the manifest, CHANGELOG.md, and the version
          # line in pyproject.toml / uv.lock. The content check, not the
          # branch name, is what makes skipping safe.
          release_only() {
            local allowed ver old new
            case "${HEAD_REF}" in release-please--*) ;; *) return 1 ;; esac
            [ "${HEAD_REPO}" = "${REPOSITORY}" ] || return 1
            allowed='^(\.release-please-manifest\.json|CHANGELOG\.md|pyproject\.toml|uv\.lock)$'
            if printf '%s\n' "$changed" | grep -vE "$allowed" | grep . >/dev/null; then
              return 1
            fi
            ver='s/.*"\.": *"([^"]+)".*/\1/p'
            old="$(git show "${BASE_SHA}:.release-please-manifest.json" \
              | sed -nE "$ver")" || return 1
            new="$(sed -nE "$ver" .release-please-manifest.json)"
            [ -n "$old" ] && [ -n "$new" ] && [ "$old" != "$new" ] || return 1
            # The manifest may differ from base only in the "." version.
            local strip base_manifest head_manifest
            strip='s/"\.": *"[^"]+"/".": ""/'
            base_manifest="$(git show "${BASE_SHA}:.release-please-manifest.json" \
              | sed -E "$strip")" || return 1
            head_manifest="$(sed -E "$strip" .release-please-manifest.json)"
            [ "$head_manifest" = "$base_manifest" ] || return 1
            # Every changed pyproject.toml / uv.lock line must be the bump.
            if git diff -U0 "${BASE_SHA}...HEAD" -- pyproject.toml uv.lock \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vxF -e "-version = \"${old}\"" -e "+version = \"${new}\"" \
                | grep . >/dev/null; then
              return 1
            fi
          }
          if release_only; then
            emit false true false
            echo "INFO: release-please version bump - skipping heavy jobs"
            exit 0
          fi

          # release-generation inputs: the generator, its tests, its bun
          # toolchain, the config one test reads, and this workflow.
          tooling='^scripts/release[^/]*\.cjs$|^scripts/run-release-tests\.sh$'
          tooling="$tooling|^tests/release/|^package\.json$|^bun\.lock$"
          tooling="$tooling|^\.bun-version$|^release-please-config\.json$"
          tooling="$tooling|^\.github/workflows/ci\.yml$"
          release_tooling=false
          if printf '%s\n' "$changed" | grep -E "$tooling" >/dev/null; then
            release_tooling=true
          fi

          # Skip-list: paths that can never affect lint/types/tests/build.
          # Anything NOT matching these patterns counts as a code change.
          # README.md is markdown but NOT skippable: it's `project.readme`,
          # a packaging input that build-smoke must validate (CodeRabbit).
          skip='^docs/|^assets/|^\.vscode/|^\.cursor/|^\.windsurf|\.md$'
          skip="$skip|^LICENSE$|^\.github/ISSUE_TEMPLATE/"
          # .contributors.jsonl is contributors-please's generated ledger -
          # bookkeeping only, so the weekly bot PR stays on the docs-only
          # fast path now that its commits no longer carry [skip ci].
          skip="$skip|^\.contributors\.jsonl$"
          if printf '%s\n' "$changed" | grep -x 'README\.md' >/dev/null \
              || printf '%s\n' "$changed" \
              | grep -vE "$skip" \
              | grep . >/dev/null; then
            emit true false "$release_tooling"
            echo "INFO: code paths changed - running all jobs" \
              "(release_tooling=$release_tooling)"
          else
            emit false false "$release_tooling"
            echo "INFO: docs-only diff - skipping heavy jobs"
          fi

  # ITM-025 + P12 - static checks in one job: ruff check + format --check,
  # taplo, ShellCheck, and the Sphinx docs build (WL-021). They used to be
  # four jobs of 6-12 s each; private repos bill each job as a full minute.
  # Every check step runs even if an earlier one fails, so one red tool never
  # hides another's result. Always runs (fast) - ruff also lints docs
  # snippets, and the docs build must pass on docs-only PRs.
  # Link checking is external-network-flaky, so it lives in the weekly
  # workflow (dep-audit.yml) instead of here.
  lint:
    name: lint
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Install just
        uses: extractions/setup-just@v4
      # `just install-taplo` downloads the upstream pre-built binary
      # (curl + gunzip from https://github.com/tamasfe/taplo/releases),
      # the same path as local dev.
      - name: Install taplo
        run: just install-taplo
      - name: Install ShellCheck
        run: |
          bash scripts/install-shellcheck.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync locked dev + docs tools (web extra so autodoc imports resolve)
        id: setup
        run: uv sync --locked --group docs --extra web
      - name: Ruff check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .
      - name: Check TOML formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: taplo check '**/*.toml'
      - name: Check shell scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/check-shell.sh
      - name: Sphinx build (warnings are errors)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync sphinx-build -W -b html docs/source docs/_build/html

  release-generation:
    name: release-generation
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.release_tooling == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version-file: .bun-version
      - name: Install frozen tooling
        run: bun install --frozen-lockfile
      - name: Test release generation
        run: bun test tests/release

  # ITM-026 - typecheck job (ty, per ADR-03) + ADR 0018 architectural
  # boundary gate. import-linter (HEX-30) and tach (HEX-31) previously ran
  # ONLY in the pre-push hook / `just check`, so a --no-verify push or an
  # uninstalled hook could land boundary violations with no CI gate. All
  # three need the same synced env, so P12 runs them as steps of one job;
  # each step reports even if another fails. WL-001: locked via uv.lock,
  # matching the pre-push hook exactly.
  typecheck:
    name: typecheck
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Sync dev env (ty and the graph builds need project deps)
        id: setup
        run: uv sync --locked --group dev --extra web
      - name: ty check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync ty check src/py_launch_blueprint/
      - name: import-linter (HEX-30)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync lint-imports
      - name: tach (HEX-31)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --no-sync tach check

  # ITM-030 - test matrix: ubuntu + macOS x py3.13 (decided round 3);
  # windows added alongside the platform-native default paths (REC-24).
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: >-
      ${{
        matrix.os == 'ubuntu' && (vars.RUNNER_UBUNTU || 'ubuntu-latest') ||
        matrix.os == 'macos' && (vars.RUNNER_MACOS || 'macos-latest') ||
        matrix.os == 'windows' && (vars.RUNNER_WINDOWS || 'windows-latest') ||
        matrix.os
      }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write  # OIDC for tokenless Codecov upload (public repo)
    strategy:
      fail-fast: false  # see all failures, not just the first (round-3)
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.13"]
        # Runtime coverage on Linux; 3.13 retains the full platform matrix.
        include:
          - os: ubuntu
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dev env
        run: uv sync --locked --group dev --extra web  # PEP 735; web extra covers web/
      # Coverage runs only on the one matrix cell that uploads it. Every other
      # cell used to compute coverage and discard it — the Codecov step below
      # has always been gated to ubuntu/3.13 — while still paying for the
      # pytest-cov + xdist combine step. That combine is where
      # `coverage.exceptions.DataError: no such table: other_db.file` came from:
      # one worker's .coverage.* SQLite file is unreadable, the worker dies, and
      # xdist then reports the downstream `KeyError: <WorkerController gwN>`.
      # It is a known pytest-cov/xdist issue, flaky at roughly 12% of runs
      # (measured: 14 pass / 2 fail over 16 runs of test (macos / py3.13)).
      # Not running coverage where nothing consumes it removes the exposure on
      # two of three cells and makes those jobs faster. There is no fail_under
      # and nothing else reads coverage.xml, so no signal is lost.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        # CI includes slow tests but excludes unprovisioned live tests.
        # Local defaults skip both markers (ITM-046 addopts).
        # WL-008: `-n auto` parallelises across the runner's cores; branch
        # coverage is on via [tool.coverage.run] (ADR-0019). xdist + pytest-cov
        # combine coverage from all workers automatically.
        run: >-
          uv run --no-sync pytest -m "not live" -n auto
          --cov=py_launch_blueprint --cov-report=xml
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu' && matrix.python-version == '3.13') }}
        run: uv run --no-sync pytest -m "not live" -n auto
      - name: Upload coverage to Codecov
        # Only the Ubuntu matrix cell uploads coverage.
        # use_oidc: tokenless upload (public repo). Requires `id-token: write`.
        if: matrix.os == 'ubuntu' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # P10 / sweep ISS-001 - the matrix above installs only the web extra, so
  # the tracing path (web/telemetry.py, core/logging.py trace stamping) never
  # runs there and opentelemetry-* bumps went untested at PR time. This leg
  # adds the otel extra and runs the suites that exercise it; the matrix keeps
  # covering the default no-otel install and its degrade path.
  test-otel:
    name: test-otel
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Sync dev env with the otel extra
        run: uv sync --locked --group dev --extra web --extra otel
      - name: Run tracing-relevant tests
        run: >-
          uv run --no-sync pytest -m "not live" -n auto
          tests/web tests/core/test_logging.py

  # WL-004 - build + install smoke test. Catches packaging breakage (missing
  # files, broken entry point, bad metadata) at PR time instead of at the
  # release tag. uv end-to-end: uv build -> twine metadata check (locked via
  # dev group) -> install wheel AND sdist into fresh envs and run the CLI.
  build-smoke:
    name: build-smoke
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    # Also on the release-please fast path: the bumped version is a
    # packaging input.
    if: >-
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Build sdist + wheel
        run: uv build
      - name: Sync locked dev tools
        run: uv sync --locked --only-group dev
      - name: Check dist metadata (twine)
        run: uv run --no-sync twine check dist/*
      - name: Smoke test wheel install
        run: uvx --from "$(ls dist/*.whl)" plbp --version
      - name: Smoke test sdist install
        run: uvx --from "$(ls dist/*.tar.gz)" plbp --version

  # WL-006 - single gate for branch protection. Require ONLY this check;
  # job renames/additions then never desync the required-checks list.
  # Skipped jobs (docs-only PRs, WL-019) count as success; anything that
  # failed or was cancelled fails the gate.
  ci-ok:
    name: ci-ok
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs:
      - changes
      - lint
      - release-generation
      - typecheck
      - test
      - test-otel
      - build-smoke
    if: always()
    permissions: {}
    steps:
      - name: Check aggregate result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "FAIL: at least one required job did not succeed" >&2
              exit 1
            fi
          done
          echo "PASS: all required jobs succeeded or were skipped"
