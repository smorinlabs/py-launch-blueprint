# WL-014 triage bot: when the scheduled weekly-audit run fails, diagnose the
# failure with Muse Spark (standard tier, via the opencode CLI) and open a
# fix PR for human review. Sandwich shape adapted from the
# smorinlabs-harness muse-github-setup skill templates; deliberate deviations:
#
# - Runner is the opencode CLI (pinned npm release), NOT the OpenCode GitHub
#   Action: the pinned Action entrypoint unconditionally rejects every event
#   except issue/PR comments (verified at anomalyco/opencode@a97622c), so it
#   cannot serve workflow_run, workflow_dispatch, schedule, or pull_request
#   triggers. The skill's Action-based templates have the same limitation.
# - Trigger is workflow_run (weekly-audit completion), not pull_request, plus
#   workflow_dispatch replay of a failed run id for piloting/testing.
# - No member authorization: a scheduled failure has no requesting human, so
#   trigger-origin gates replace it (own schedule + default branch +
#   kill-switch + one triage PR per run id). Approved owner decision (P04).
# - Validation runs BEFORE checkout: the resolve step asserts workflow name,
#   failure, default branch, and trigger event from trusted context, because
#   checking out first would execute the audited commit's helper pre-check.
# - Model is model_api/muse-spark-1.3 (standard, non-training tier) instead
#   of the contributor default. Consequence: repo-secrets consumer detection
#   (pinned to the contributor string) does not match, so META_MUSE_CI_API_KEY
#   is provisioned by the manual fallback and verified by presence.
# - Replays of runs older than this tooling are refused: the audited commit
#   must contain the helper and profiles.
# - The finish step curl-verifies every touched URL (page level; fragments
#   never reach a server) and posts the table on the PR. Only
#   definitively-dead URLs fail the run; bot-ambiguous statuses warn.
#
# The bot proposes, the deterministic layer verifies, a human merges.
# Ships to pressed forks inert: without the MUSE_CI_ENABLED repo variable
# (and secret) the job skips. Forks that adopt it must also set their owner
# login in .opencode/audit-triage/policy.json. Set the variable only after
# the skill's acceptance prerequisites hold.
name: audit-triage

on:
  workflow_run:
    workflows: [weekly-audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed weekly-audit run id to triage (replay for pilot/testing)
        required: true
        type: string

permissions: {}

concurrency:
  group: audit-triage
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      vars.MUSE_CI_ENABLED == 'true' &&
      github.event.repository.owner.type == 'Organization' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Validate target run and resolve audited commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_RUN_ID" in
              ''|*[!0-9]*)
                echo "::error::run_id must be a weekly-audit run id" >&2
                exit 1
                ;;
            esac
            run_url="repos/${GITHUB_REPOSITORY}/actions/runs/${DISPATCH_RUN_ID}"
            run="$(gh api "$run_url")"
            name="$(echo "$run" | jq -r .name)"
            conclusion="$(echo "$run" | jq -r .conclusion)"
            event="$(echo "$run" | jq -r .event)"
            branch="$(echo "$run" | jq -r .head_branch)"
            sha="$(echo "$run" | jq -r .head_sha)"
            [ "$name" = "weekly-audit" ] || { echo "::error::not a weekly-audit run" >&2; exit 1; }
            [ "$conclusion" = "failure" ] || { echo "::error::run did not fail" >&2; exit 1; }
            case "$event" in
              schedule|workflow_dispatch) ;;
              *) echo "::error::replay target must be schedule- or dispatch-triggered" >&2; exit 1 ;;
            esac
            [ "$branch" = "$DEFAULT_BRANCH" ] || { echo "::error::run is not on the default branch" >&2; exit 1; }
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "::error::run has no head SHA" >&2
              exit 1
            fi
          else
            [ "$WR_NAME" = "weekly-audit" ] || { echo "::error::not a weekly-audit run" >&2; exit 1; }
            [ "$WR_CONCLUSION" = "failure" ] || { echo "::error::run did not fail" >&2; exit 1; }
            [ "$WR_EVENT" = "schedule" ] || { echo "::error::automatic triage handles schedule-triggered runs only" >&2; exit 1; }
            [ "$WR_BRANCH" = "$DEFAULT_BRANCH" ] || { echo "::error::run is not on the default branch" >&2; exit 1; }
            sha="$WR_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out audited commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize trigger and prepare frozen failure bundle
        id: prepare
        run: python3 .github/scripts/audit_triage.py prepare triage
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Meta credential is configured
        if: steps.prepare.outputs.should_run == 'true'
        run: test -n "$META_MUSE_CI_API_KEY"
        env:
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}

      - name: Install opencode CLI
        if: steps.prepare.outputs.should_run == 'true'
        env:
          OPENCODE_VERSION: "1.17.18"
        run: |
          set -euo pipefail
          npm install --global "opencode-ai@${OPENCODE_VERSION}"
          command -v opencode
          opencode --version

      - name: Create triage branch
        if: steps.prepare.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: git checkout -b "$BRANCH"

      - name: Diagnose and repair with Muse Spark
        if: steps.prepare.outputs.should_run == 'true'
        env:
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}
          TRIAGE_PROMPT: ${{ steps.prepare.outputs.prompt }}
        run: opencode run --model model_api/muse-spark-1.3 --agent muse-triage "$TRIAGE_PROMPT"

      - name: Commit repair
        id: commit
        if: steps.prepare.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Agent made no changes; skipping commit."
            exit 0
          fi
          run_id="${BRANCH#bot/weekly-audit-}"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix(docs): triage weekly-audit run ${run_id}"
          git push -u origin "$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create triage PR
        id: create-pr
        if: steps.prepare.outputs.should_run == 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          run_id="${BRANCH#bot/weekly-audit-}"
          base="$(gh repo view --json defaultBranch --jq .defaultBranch)"
          body="$(printf 'Triage of weekly-audit run %s.\n\nAutomated docs repair; verification table follows from the finish step.\nAudit run: https://github.com/%s/actions/runs/%s\n' "$run_id" "$GITHUB_REPOSITORY" "$run_id")"
          number="$(gh pr create --head "$BRANCH" --base "$base" --title "fix(docs): triage weekly-audit run ${run_id}" --body "$body" --json number --jq .number)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Verify scope and touched URLs
        if: always() && steps.prepare.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MUSE_CI_PR: ${{ steps.create-pr.outputs.number }}
        run: python3 "$MUSE_CI_HELPER" finish triage
