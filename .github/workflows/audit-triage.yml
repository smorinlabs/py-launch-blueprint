# WL-014 triage bot: when the scheduled weekly-audit run fails, diagnose the
# failure with Muse Spark (standard tier, via the upstream OpenCode Action)
# and open a fix PR for human review. Adapted from the smorinlabs-harness
# muse-github-setup skill templates; deliberate deviations from the skill:
#
# - Trigger is workflow_run (weekly-audit completion), not pull_request, plus
#   workflow_dispatch replay of a failed run id for piloting/testing.
# - No member authorization: a scheduled failure has no requesting human, so
#   trigger-origin gates replace it (own schedule + default branch +
#   kill-switch + one triage PR per run id). Approved owner decision (P04).
# - Model is model_api/muse-spark-1.3 (standard, non-training tier) instead
#   of the contributor default. Consequence: repo-secrets consumer detection
#   (pinned to the contributor string) does not match, so META_MUSE_CI_API_KEY
#   is provisioned by the manual fallback and verified by presence.
# - The finish step curl-verifies every touched URL (page level; fragments
#   never reach a server) and posts the table on the PR. Only
#   definitively-dead URLs fail the run; bot-ambiguous statuses warn.
#
# The bot proposes, the deterministic layer verifies, a human merges.
# Ships to pressed forks inert: without the MUSE_CI_ENABLED repo variable
# (and secret) the job skips. Set the variable only after the skill's
# acceptance prerequisites hold.
name: audit-triage

on:
  workflow_run:
    workflows: [weekly-audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed weekly-audit run id to triage (replay for pilot/testing)
        required: true
        type: string

permissions: {}

concurrency:
  group: audit-triage
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      vars.MUSE_CI_ENABLED == 'true' &&
      github.event.repository.owner.type == 'Organization' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Resolve audited commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_url="repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.run_id }}"
            sha="$(gh api "$run_url" --jq .head_sha)"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$sha" ]; then
            echo "::error::could not resolve audited commit" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out audited commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.base.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize trigger and prepare frozen failure bundle
        id: prepare
        run: python3 .github/scripts/audit_triage.py prepare triage
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Meta credential is configured
        run: test -n "$META_MUSE_CI_API_KEY"
        env:
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}

      - name: Diagnose and propose fix with Muse Spark
        # v1.18.31 action; CLI installer moves underneath the pin.
        uses: anomalyco/opencode/github@a97622c801f4ca571530ddc51076af659a9c32cd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          META_MUSE_CI_API_KEY: ${{ secrets.META_MUSE_CI_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        with:
          model: model_api/muse-spark-1.3
          agent: muse-triage
          share: "false"
          use_github_token: "true"
          prompt: ${{ steps.prepare.outputs.prompt }}

      - name: Verify scope and touched URLs
        if: always() && steps.prepare.outcome == 'success'
        run: python3 "$MUSE_CI_HELPER" finish triage
        env:
          GH_TOKEN: ${{ github.token }}
