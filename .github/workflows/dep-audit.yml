# WL-014 - scheduled dependency vulnerability audit + WL-021 docs linkcheck.
#
# Why scheduled, not per-PR: dependency-review (PR) only fires when a PR
# *changes* the manifests - a CVE published against an already-pinned
# dependency never triggers it. This weekly run audits the full locked
# graph (all extras + groups) via pip-audit (PyPA, OSV + PyPI advisory DBs).
# Locally: `just audit` runs the pip-audit half; run the linkcheck half with
# `uv sync --locked --group docs --extra web`, then
# `uv run --no-sync sphinx-build -b linkcheck docs/source docs/_build/linkcheck`.
#
# Docs linkcheck lives here too: external links rot independently of PRs,
# and flaky third-party sites should not block merges (the blocking -W html
# build runs per-PR in ci.yml).

name: weekly-audit

on:
  schedule:
    - cron: '0 5 * * 1'  # weekly, Monday 05:00 UTC (after dependabot's run)
  workflow_dispatch:

permissions: {}

concurrency:
  group: dep-audit
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync locked dev tools
        run: uv sync --locked --only-group dev

      - name: Export locked dependency graph
        # Full closure, hashed + pinned, so pip-audit needs no resolver
        # (--disable-pip) and audits exactly what uv.lock ships.
        run: >-
          uv export --locked --no-emit-project --all-extras --all-groups
          --format requirements.txt -o requirements-audit.txt

      - name: Audit against known vulnerabilities
        run: >-
          uv run --no-sync pip-audit --strict --disable-pip
          -r requirements-audit.txt

  docs-linkcheck:
    name: docs-linkcheck
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Sync docs env (web extra so autodoc imports resolve)
        run: uv sync --locked --group docs --extra web

      - name: Sphinx linkcheck
        run: >-
          uv run --no-sync sphinx-build -b linkcheck
          docs/source docs/_build/linkcheck

  # WL-014 response loop: a scheduled red with no receiver stays red until
  # someone opens the Actions tab. This job files (or prepends to) one
  # rolling tracking issue per red run. Humans close the issue when the
  # backlog is triaged; the next red run opens a fresh one.
  file-tracking-issue:
    name: file-tracking-issue
    needs: [pip-audit, docs-linkcheck]
    if: failure() && github.event_name == 'schedule'
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: File or update the rolling audit-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          entry="- $(date -u +%FT%TZ) run ${RUN_ID} (\`${HEAD_SHA:0:7}\`): ${failed_jobs} — ${RUN_URL}"
          label_args=()
          labels="$(gh label list --json name --jq '.[].name' | tr '\n' ',')"
          case ",${labels}," in *,weekly-audit,*) label_args=(--label weekly-audit) ;; esac
          existing="$(gh issue list ${label_args[@]+"${label_args[@]}"} --state open --json number,body --jq '[.[] | select(.body != null and (.body | contains("<!-- weekly-audit-tracking -->"))) | .number][0] // empty')"
          if [ -n "$existing" ]; then
            body="$(gh issue view "$existing" --json body --jq .body)"
            printf '%s\n' "$body" | awk -v entry="$entry" '
              BEGIN { in_entries = 0; kept = 1 }
              /^## Failures \(newest first\)$/ { print; print entry; in_entries = 1; next }
              in_entries && /^- [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T/ { kept++; if (kept > 30) next }
              in_entries && /^## / { in_entries = 0 }
              { print }
            ' > /tmp/tracking-body.md
            gh issue edit "$existing" --body-file /tmp/tracking-body.md
          else
            {
              echo '<!-- weekly-audit-tracking -->'
              echo
              echo "The scheduled \`weekly-audit\` run failed. Triage each entry, then close"
              echo 'this issue when the backlog is clear (a later red run opens a fresh one).'
              echo
              echo '## Failures (newest first)'
              echo
              echo "$entry"
              echo
              echo '## Notes'
              echo
              echo "- Diagnosis and fix PRs come from the \`audit-triage\` workflow runs linked above."
            } > /tmp/tracking-body.md
            gh issue create --title 'weekly-audit failures need triage' ${label_args[@]+"${label_args[@]}"} --body-file /tmp/tracking-body.md
          fi
