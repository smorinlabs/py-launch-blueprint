# Press drift guard (P06) — replaces the init-era blueprint-guard and
# init-integration workflows. `press verify` hermetically self-presses a
# sandbox copy and scans for surviving identity: any added identity-bearing
# file that presses dirty fails this check (exit 1); config errors exit 2.
# This workflow deliberately SHIPS to generated projects — a pressed fork
# is itself a valid press target, and this is its drift guard too.
name: press-verify

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  press-verify:
    # ubuntu-latest, not a custom runner: this workflow deliberately
    # ships to generated repositories, which have no blacksmith runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          github-token: ${{ github.token }}
      - name: No committed receipt in the template
        # Blueprint-scoped (ports check_no_marker.sh's surviving function):
        # a receipt committed to the TEMPLATE would silence every fork's
        # guard. Generated projects legitimately commit theirs.
        if: ${{ github.repository == 'smorinlabs/py-launch-blueprint' }}
        run: |
          if [ -f press/press-receipt.toml ]; then
            echo "::error::press-receipt.toml committed in the template —" \
              "it would disarm every fork's guard. Revert."
            exit 1
          fi
      - name: press verify
        # WL-001: hook/CI tools run from the locked dev group, never
        # floating uvx — the version comes from uv.lock.
        run: |
          uv sync --group dev
          uv run press verify
